spring.application.name=PayrollSystem



spring.datasource.url=jdbc:mysql://localhost:3306/payroll_system
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app-jwt-expiration-milliseconds=18000000
app.jwt-secret=${jwt_secret}

logging.level.root=info

logging.level.org.hibernate.springframework=error

logging.file.name=app.log

spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${smtp_email}
spring.mail.password=${smtp_email_password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
#spring.batch.jdbc.schema=classpath:org/springframework/batch/core/schema-mysql.sql
#spring.datasource.initialization-mode=always



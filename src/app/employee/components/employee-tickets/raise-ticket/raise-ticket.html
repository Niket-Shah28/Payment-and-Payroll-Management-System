<div class="container mt-3">
  <h3>Raise a Ticket</h3>
  <form [formGroup]="ticketForm" (ngSubmit)="submitTicket()">
    <div class="mb-3">
      <label for="query" class="form-label">Your Query</label>
      <textarea id="query" formControlName="query" rows="5" class="form-control"></textarea>
      <div *ngIf="ticketForm.get('query')?.invalid && ticketForm.get('query')?.touched" class="text-danger">
        Query must be at least 10 characters.
      </div>
    </div>
    <button class="btn btn-primary" [disabled]="ticketForm.invalid">Submit Ticket</button>
  </form>
</div>

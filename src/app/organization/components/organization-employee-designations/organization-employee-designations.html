<mat-card class="department-card mat-elevation-z8">
    <mat-toolbar class="header-section">
    <mat-card-title>Designations</mat-card-title>
    <span class="toolbar-spacer"></span>
    <button mat-raised-button color="primary" (click)="toggleForm()">
      <mat-icon>add</mat-icon> Add Designation
    </button>
  </mat-toolbar>

  <div class="add-form" *ngIf="showForm">
    <form [formGroup]="employeeRoleForm" (ngSubmit)="addRole()">
      <mat-form-field appearance="outline" class="department-input">
        <mat-label>Designation</mat-label>
        <input matInput formControlName="role" placeholder="Enter Role">
        <mat-error *ngIf="employeeRoleForm.get('role')?.invalid && employeeRoleForm.get('role')?.touched">
          Role is required (min 2 chars)
        </mat-error>
      </mat-form-field>

      <button mat-raised-button color="accent" type="submit" [disabled]="employeeRoleForm.invalid">
        <mat-icon>check</mat-icon> Add
      </button>
    </form>
  </div>
  <div class="table-responsive">
    <table mat-table [dataSource]="roles" class="mat-elevation-z2 table-custom">

      <ng-container matColumnDef="#">
        <th mat-header-cell *matHeaderCellDef> # </th>
        <td mat-cell *matCellDef="let element; let i = index"> {{ i + 1 }} </td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef> Designation </th>
        <td mat-cell *matCellDef="let element">

          <div *ngIf="editingRoleId === element.roleId; else viewMode">
            <form [formGroup]="editForm" (ngSubmit)="saveEdit(element)">
              <mat-form-field appearance="fill" class="inline-edit-input">
                <input matInput formControlName="editedRoleName" (keydown.enter)="saveEdit(element)">
                <mat-error *ngIf="editForm.get('editedRoleName')?.invalid">
                    Required
                </mat-error>
              </mat-form-field>
            </form>
          </div>
          <ng-template #viewMode>
            {{ element.role }}
          </ng-template>

        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef> Actions </th>
        <td mat-cell *matCellDef="let element">

          <div *ngIf="editingRoleId === element.roleId; else actionButtons">
            <button mat-icon-button color="primary" (click)="saveEdit(element)" [disabled]="editForm.invalid" aria-label="Save edit">
              <mat-icon>done</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="cancelEdit()" aria-label="Cancel edit">
              <mat-icon>close</mat-icon>
            </button>
          </div>

          <ng-template #actionButtons>
            <button mat-icon-button color="accent" (click)="startEdit(element)" aria-label="Edit role">
              <mat-icon>edit</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deleteRole(element.roleId)" aria-label="Delete role">
              <mat-icon>delete</mat-icon>
            </button>
          </ng-template>

        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

      <tr class="mat-row no-data-row" *matNoDataRow>
        <td class="mat-cell" [attr.colspan]="displayedColumns.length">
          No roles found.
        </td>
      </tr>
    </table>
  </div>
</mat-card>

<div *ngIf="errorMessage" class="error-overlay">
    <mat-card class="error-card mat-elevation-z20">
        <div class="error-content">
            <mat-icon color="warn">error_outline</mat-icon>
            <span class="error-message">{{ errorMessage }}</span>
        </div>
        <button mat-icon-button class="close-button" (click)="clearError()" aria-label="Close error message">
            <mat-icon>close</mat-icon>
        </button>
    </mat-card>
</div>
